name: Sync Classroom Assets to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Download and Unpack Repository Snapshot
        run: |
          REPO="task4z/classroom-15x"
          COMMIT="ebc85c55d9e12d923cafa5961c305b59794868d3"
          URL="https://github.com/${REPO}/archive/${COMMIT}.tar.gz"

          echo "Downloading and extracting snapshot directly to repo root..."
          # Fetch and pipe the tarball directly, stripping the first directory level
          curl -sL "$URL" | tar -xz --strip-components=1

      - name: Commit and Push to Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Import snapshot assets from task4z/classroom-15x"
            git push origin main
          fi
